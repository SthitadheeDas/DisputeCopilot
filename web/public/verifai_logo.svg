<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Shield Core Gradient -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>

    <!-- Checkmark Glow -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid Accent -->
  <circle cx="256" cy="190" r="140" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="190" r="165" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 12" opacity="0.3" />

  <!-- Shield Outer Glow / Aura -->
  <path d="M 256 75 
           C 325 110, 365 125, 365 185 
           C 365 265, 305 325, 256 345 
           C 207 325, 147 265, 147 185 
           C 147 125, 187 110, 256 75 Z"
        fill="none" stroke="#38BDF8" stroke-width="6" opacity="0.35" filter="url(#glow)" />

  <!-- Main Shield Body -->
  <path d="M 256 80 
           C 320 114, 358 128, 358 185 
           C 358 260, 302 318, 256 338 
           C 210 318, 154 260, 154 185 
           C 154 128, 192 114, 256 80 Z"
        fill="url(#shieldInner)" stroke="url(#shieldGrad)" stroke-width="4" />

  <!-- Inner Geometric Bevel -->
  <path d="M 256 98 
           C 305 125, 338 138, 338 185 
           C 338 245, 292 295, 256 314 
           C 220 295, 174 245, 174 185 
           C 174 138, 207 125, 256 98 Z"
        fill="#0F172A" stroke="#334155" stroke-width="2" opacity="0.8" />

  <!-- Verified AI Checkmark / Lightning Node -->
  <path d="M 205 188 
           L 242 225 
           L 310 152"
        fill="none" stroke="url(#checkGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Circuit Connection Dots -->
  <circle cx="205" cy="188" r="4" fill="#38BDF8" />
  <circle cx="242" cy="225" r="4" fill="#60A5FA" />
  <circle cx="310" cy="152" r="5" fill="#34D399" filter="url(#subtleGlow)" />

  <!-- Central Security Core Ring -->
  <circle cx="256" cy="188" r="55" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.25" />

  <!-- Brand Typography -->
  <g id="brand-text">
    <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#F8FAFC">
      VERIF<tspan fill="#38BDF8">AI</tspan>
    </text>

    <!-- Subtitle Pill -->
    <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="2.5" fill="#94A3B8">
      AUTONOMOUS MERCHANT DEFENSE
    </text>
  </g>
</svg>